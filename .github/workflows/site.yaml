name: site

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - 'trunk'

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.message.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t lenox .
      - run: docker run --volume="$PWD/site:/blog" lenox /blog

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/out
          if-no-files-found: error

      - id: message
        run: git log "--format=message=%h %s" -n 1 $GITHUB_SHA >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - run: ./gradlew check


  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >-
      ${{
        github.repository == 'nikeorever/lenox.fyi'
        && github.ref == 'refs/heads/trunk'
        && github.event_name != 'pull_request'
      }}

    needs:
      - compile
      - check

    concurrency:
      group: production-site-deploy
      cancel-in-progress: false

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out

      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${ECS_HOST}" \
            'test -d /var/www/site && test -w /var/www/site'

      - name: Deploy to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          rsync -az \
            --delete \
            --delay-updates \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            out/ \
            "deploy@${ECS_HOST}:/var/www/site/"
