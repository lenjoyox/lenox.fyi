name: site

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - 'trunk'

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.message.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t lenox .
      - run: docker run --volume="$PWD/site:/blog" lenox /blog

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/out
          if-no-files-found: error

      - id: message
        run: git log "--format=message=%h %s" -n 1 $GITHUB_SHA >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - run: ./gradlew check


  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >-
      ${{
        github.repository == 'lenjoyox/lenox.fyi'
        && github.ref == 'refs/heads/trunk'
        && github.event_name != 'pull_request'
      }}

    needs:
      - compile
      - check

    concurrency:
      group: production-site-deploy
      cancel-in-progress: false

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out

      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${ECS_HOST}" \
            'test -d /var/www/site && test -w /var/www/site'

      - name: Deploy to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          rsync -az \
            --delete \
            --delay-updates \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            out/ \
            "deploy@${ECS_HOST}:/var/www/site/"

      # Runs only after a successful deploy above. All failures are downgraded to
      # warnings so that indexing issues never turn a completed deploy red.
      - name: Push URLs to Baidu
        env:
          BAIDU_PUSH_URL: ${{ secrets.BAIDU_PUSH_URL }}
        run: |
          set -uo pipefail

          if [ -z "${BAIDU_PUSH_URL:-}" ]; then
            echo "::warning::BAIDU_PUSH_URL secret is not configured; skipping Baidu push."
            exit 0
          fi

          sitemap="out/sitemap.xml"
          if [ ! -f "$sitemap" ]; then
            echo "::warning::Sitemap not found at $sitemap; skipping Baidu push."
            exit 0
          fi

          urls="$(mktemp)"
          tmpdir="$(mktemp -d)"
          trap 'rm -f "$urls"; rm -rf "$tmpdir"' EXIT

          grep -oE '<loc>[^<]+</loc>' "$sitemap" \
            | sed -E 's#</?loc>##g; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | awk 'NF && !seen[$0]++' > "$urls"

          total="$(wc -l < "$urls" | tr -d ' ')"
          if [ "$total" -eq 0 ]; then
            echo "::warning::No URLs found in $sitemap; skipping Baidu push."
            exit 0
          fi

          batch_size=1000
          split -l "$batch_size" -d "$urls" "$tmpdir/batch-"

          failed=0
          pushed=0
          for batch in "$tmpdir"/batch-*; do
            [ -e "$batch" ] || continue
            count="$(wc -l < "$batch" | tr -d ' ')"
            echo "Pushing $count URL(s) to Baidu…"
            if ! response="$(curl -sS --fail-with-body --max-time 30 \
                -H 'Content-Type: text/plain' \
                --data-binary "@$batch" \
                "$BAIDU_PUSH_URL")"; then
              echo "::warning::Baidu push request failed for a batch of $count URL(s)."
              failed=1
              continue
            fi
            echo "Baidu response: $response"
            if printf '%s' "$response" | grep -q '"error"'; then
              echo "::warning::Baidu rejected a batch of $count URL(s): $response"
              failed=1
              continue
            fi
            pushed=$((pushed + count))
          done

          if [ "$failed" -ne 0 ]; then
            echo "::warning::Some Baidu push batches failed; the deployment itself completed successfully."
          else
            echo "Pushed $pushed of $total URL(s) to Baidu successfully."
          fi
          exit 0
